<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Haryn AI">
  <defs>
    <linearGradient id="tile" x1="5" y1="3" x2="26" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#0d9488" />
    </linearGradient>
    <radialGradient id="sheen" cx="11" cy="8" r="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35" />
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!--
      The node's gap is a hole cut out of the tile, not a white ring: the favicon
      sits on a tab whose colour we do not control.
    -->
    <mask id="cutout">
      <rect width="32" height="32" fill="#fff" />
      <circle cx="26.5" cy="5.5" r="6.3" fill="#000" />
    </mask>
  </defs>

  <g mask="url(#cutout)">
    <rect x="2" y="2" width="26" height="26" rx="8" fill="url(#tile)" />
    <rect x="2" y="2" width="26" height="26" rx="8" fill="url(#sheen)" />
  </g>

  <!-- H -->
  <path
    d="M9.5 8h3.5v5.6h6V8H22.5v16H19v-6.2h-6V24H9.5z"
    fill="#ffffff"
  />

  <circle cx="26.5" cy="5.5" r="4.6" fill="#22d3ee" />
</svg>
